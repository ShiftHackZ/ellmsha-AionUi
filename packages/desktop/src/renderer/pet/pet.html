<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      body {
        position: relative;
      }
      #pet {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background-position: 0 0;
        background-repeat: no-repeat;
        background-size: 800% 1100%;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="pet" aria-hidden="true"></div>
    <script type="module" src="./petRenderer.ts"></script>
  </body>
</html>
